<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nie znaleziono strony – OSDigital</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="https://osdigital.pages.dev/themes/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<noscript><style>#preloader{display:none}.reveal{opacity:1!important;transform:none!important}</style></noscript>
<style>
:root{--ink:#14171f;--ink-2:#4a5565;--line:#e3e7ee;--accent:#0b7a75;--accent-d:#085e5a;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box;margin:0}
body{font-family:'Open Sans',system-ui,sans-serif;color:var(--ink);background:#fff;line-height:1.65;-webkit-font-smoothing:antialiased}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{width:min(1180px,100% - 48px);margin-inline:auto}
.ico{width:1.25em;height:1.25em;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

#preloader{position:fixed;inset:0;z-index:100;background:#fff;display:grid;place-items:center;transition:opacity .6s var(--ease),visibility .6s}
#preloader.done{opacity:0;visibility:hidden}
#preloader img{width:84px;height:84px;animation:spin 1.4s linear infinite}

.site-header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.86);backdrop-filter:blur(12px)}
.nav{display:flex;align-items:center;justify-content:space-between;height:76px}
.nav .logo img{height:34px;width:auto}
.nav ul{display:flex;gap:36px;list-style:none;padding:0}
.nav ul a{font-weight:600;font-size:15px;color:var(--ink-2);position:relative;padding:6px 0;transition:color .25s}
.nav ul a::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.nav ul a:hover{color:var(--ink)}.nav ul a:hover::after{transform:scaleX(1)}
.menu-btn{display:none;background:none;border:0;padding:8px;cursor:pointer;color:var(--ink)}
.menu-btn .ico{width:26px;height:26px}

.btn{display:inline-flex;align-items:center;gap:10px;font:600 15px 'Open Sans',sans-serif;padding:14px 28px;border-radius:999px;border:1.5px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;transition:background .3s,transform .3s var(--ease),box-shadow .3s}
.btn:hover{background:var(--accent-d);border-color:var(--accent-d);transform:translateY(-2px);box-shadow:0 10px 24px -10px rgba(11,122,117,.6)}
.btn .ico{transition:transform .3s var(--ease)}.btn:hover .ico{transform:translateX(4px)}

.reveal{opacity:0;transform:translateY(24px);transition:opacity .8s var(--ease),transform .8s var(--ease);transition-delay:var(--d,0s)}
.reveal.in{opacity:1;transform:none}

.nf{min-height:calc(100vh - 76px);display:grid;place-items:center;text-align:center;padding:60px 0}
.nf .code{display:flex;justify-content:center;align-items:center;gap:8px;font-size:clamp(5rem,16vw,10rem);font-weight:700;letter-spacing:-.04em;line-height:1}
.nf .code img{height:.78em;width:.78em;animation:spin 8s linear infinite}
.nf h1{font-size:1.7rem;margin-top:20px}
.nf p{color:var(--ink-2);margin:12px auto 32px;max-width:30em}

@media(max-width:900px){
  .menu-btn{display:block}
  .nav ul{position:absolute;top:76px;left:0;right:0;background:#fff;flex-direction:column;gap:0;padding:8px 24px 20px;border-bottom:1px solid var(--line);display:none}
  .nav ul.open{display:flex}.nav ul a{display:block;padding:14px 0}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}.reveal{opacity:1;transform:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
</svg>

<div id="preloader" aria-hidden="true"><img src="/themes/OSDigital_sygnet_color-light-bg.svg" alt=""></div>

<header class="site-header"><div class="wrap nav">
  <a class="logo" href="/" aria-label="OSDigital – strona główna"><img src="/themes/OSDigital_poziome_color-light-bg.svg" alt="OSDigital" width="150" height="34"></a>
  <button class="menu-btn" aria-label="Menu" aria-expanded="false"><svg class="ico" aria-hidden="true"><use href="#i-menu"/></svg></button>
  <ul>
    <li><a href="/">Start</a></li>
    <li><a href="/#uslugi">Usługi</a></li>
    <li><a href="/#realizacje">Realizacje</a></li>
    <li><a href="/kontakt">Kontakt</a></li>
  </ul>
</div></header>

<main class="nf"><div class="wrap">
  <div class="code reveal" aria-label="Błąd 404"><span>4</span><img src="/themes/OSDigital_sygnet_color-light-bg.svg" alt=""><span>4</span></div>
  <h1 class="reveal" style="--d:.1s">Nie znaleźliśmy tej strony</h1>
  <p class="reveal" style="--d:.15s">Adres mógł się zmienić albo zawiera literówkę. Wróć na stronę główną lub napisz do nas.</p>
  <div class="reveal" style="--d:.2s"><a class="btn" href="/">Wróć na stronę główną <svg class="ico" aria-hidden="true"><use href="#i-arrow"/></svg></a></div>
</div></main>

<script>
(() => {
  const pl = document.getElementById('preloader');
  let seen; try { seen = sessionStorage.getItem('os-loaded'); } catch {}
  if (seen) pl.remove();
  else {
    const t0 = performance.now();
    const hide = () => { pl.classList.add('done'); try { sessionStorage.setItem('os-loaded', '1'); } catch {} setTimeout(() => pl.remove(), 700); };
    const go = () => setTimeout(hide, Math.max(0, 900 - (performance.now() - t0)));
    document.readyState === 'complete' ? go() : addEventListener('load', go);
  }

  const mb = document.querySelector('.menu-btn'), ul = document.querySelector('.nav ul');
  mb.addEventListener('click', () => { const o = ul.classList.toggle('open'); mb.setAttribute('aria-expanded', o); mb.querySelector('use').setAttribute('href', o ? '#i-close' : '#i-menu'); });

  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .12 });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));
})();
</script>
</body>
</html>
